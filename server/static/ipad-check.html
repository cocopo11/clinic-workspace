<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이패드 보안 연결 확인</title>
<style>body{font:18px/1.7 system-ui,sans-serif;background:#f3f5ef;color:#264235;padding:30px 20px}main{max-width:620px;margin:30px auto;background:white;border:1px solid #dce3d8;border-radius:18px;padding:28px}h1{font-size:28px}#state{font-size:21px;font-weight:700}p{white-space:pre-wrap}</style>
<main><h1>아이패드 연결 확인</h1><p id="state" role="status">연결 상태 확인 중…</p><p id="next"></p><p>다음에는 python server/easy_https.py만 실행하면 됩니다. 같은 PC의 연결 인증서는 재사용합니다.</p></main>
<script>
const ok=location.protocol==='https:'&&window.isSecureContext;
document.getElementById('state').textContent=ok?'HTTPS 연결 확인 완료':'HTTPS 연결이 필요합니다';
document.getElementById('next').textContent=ok?(typeof navigator.mediaDevices?.getUserMedia==='function'&&typeof window.MediaRecorder==='function'?'모바일 진료 화면에서 환자를 검색하고 사진 비교·녹음을 선택하세요. 녹음 시작 때 마이크 사용을 허용합니다.':'보안 연결은 됐지만 이 브라우저가 웹 녹음을 지원하지 않습니다. 최신 iPadOS의 Safari에서 직접 여세요.'):'처음 연결 안내 페이지의 인증서 설치·신뢰 켜기를 완료하고 HTTPS 연결 확인을 다시 누르세요.';
</script></html>
